<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer frame -->
  <rect x="20" y="20" width="560" height="460" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Main card/form container -->
  <rect x="120" y="120" width="360" height="200" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Input field -->
  <rect x="150" y="180" width="200" height="30" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Login button -->
  <rect x="150" y="230" width="80" height="35" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Create Account button -->
  <rect x="245" y="230" width="105" height="35" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Text elements -->
  <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">FAST &amp; RECKLESS BANK</text>
  
  <text x="300" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Enter Account Number</text>
  
  <text x="160" y="200" font-family="Arial, sans-serif" font-size="12" fill="#666">ACC________________</text>
  
  <text x="190" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Login</text>
  
  <text x="297" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Create Account</text>
  
  <!-- Demo accounts section -->
  <text x="40" y="380" font-family="Arial, sans-serif" font-size="14">💡 Demo accounts available:</text>
  <text x="60" y="405" font-family="Arial, sans-serif" font-size="12">ACC1234567890 (John Doe)</text>
  <text x="60" y="425" font-family="Arial, sans-serif" font-size="12">ACC0987654321 (Jane Smith)</text>
</svg>