<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer frame -->
  <rect x="20" y="20" width="560" height="460" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Back button -->
  <rect x="40" y="40" width="140" height="25" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Current balance card -->
  <rect x="40" y="100" width="520" height="40" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Amount input field -->
  <rect x="40" y="180" width="520" height="40" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Description input field -->
  <rect x="40" y="260" width="520" height="40" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Balance preview card -->
  <rect x="40" y="330" width="520" height="50" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Cancel button -->
  <rect x="160" y="420" width="80" height="40" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Deposit button -->
  <rect x="300" y="420" width="100" height="50" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Text elements -->
  <text x="110" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">← Back to Dashboard</text>
  
  <text x="300" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">DEPOSIT MONEY</text>
  
  <text x="60" y="125" font-family="Arial, sans-serif" font-size="14">Current Balance: €1,247.50</text>
  
  <text x="40" y="175" font-family="Arial, sans-serif" font-size="12">Amount (€)</text>
  <text x="60" y="205" font-family="Arial, sans-serif" font-size="14">250.00</text>
  
  <text x="40" y="255" font-family="Arial, sans-serif" font-size="12">Description</text>
  <text x="60" y="285" font-family="Arial, sans-serif" font-size="14">Freelance payment from client</text>
  
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="12">After this transaction:</text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold">New Balance: €1,497.50</text>
  
  <text x="200" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Cancel</text>
  
  <text x="350" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Deposit</text>
  <text x="350" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">€250.00</text>
</svg>