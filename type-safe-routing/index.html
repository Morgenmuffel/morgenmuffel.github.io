<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduling Coordinator Flow - Type-Safe Routing Pattern</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: rgb(248, 250, 252);
      overflow-x: hidden;
    }

    main {
      min-height: 100vh;
      padding: 3rem 1rem;
    }

    @media (min-width: 768px) {
      main {
        padding: 5rem 1.5rem;
      }
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    @media (min-width: 768px) {
      .header {
        margin-bottom: 3rem;
      }
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: rgb(26, 35, 50);
      text-wrap: balance;
    }

    @media (min-width: 768px) {
      h1 {
        font-size: 2.25rem;
      }
    }

    .subtitle {
      color: rgb(100, 116, 139);
      font-size: 0.875rem;
      max-width: 42rem;
      margin: 0 auto;
      text-wrap: balance;
    }

    @media (min-width: 768px) {
      .subtitle {
        font-size: 1rem;
      }
    }

    .diagram-container {
      position: relative;
      overflow-x: auto;
      width: 100%;
    }

    .diagram-wrapper {
      min-width: 1500px;
      width: 100%;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .interactive-group {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .interactive-rect {
      transition: all 0.2s ease;
    }

    .interactive-line {
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <div class="header">
        <h1>Scheduling Coordinator Flow</h1>
        <p class="subtitle">Pattern Matching on Output Types - No If/Else Spaghetti</p>
      </div>

      <div class="diagram-container">
        <div class="diagram-wrapper">
          <svg id="diagram" viewBox="0 0 1500 850" stroke-width="2">
            <!-- Background grid -->

            </defs>
            <rect width="1500" height="850" fill="url(#grid)" />

            <!-- USER INPUT -->
            <g>
              <rect x="440" y="40" rx="8" ry="8" width="180" height="110" fill="white" stroke="rgb(203,213,225)" stroke-width="1.5" />
              <text x="530" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="rgb(71,85,105)">USER INPUT</text>

            <!-- COORDINATOR -->

              <rect x="680" y="40" rx="8" ry="8" width="200" height="110" fill="white" stroke="rgb(46,91,218)" stroke-width="1.5" />

            <!-- Calls sub-agents internally -->

            <!-- Lines after output types -->
            <line class="path-line2-1" x1="140" y1="335" x2="140" y2="365" stroke="rgb(148,163,184)" stroke-width="1.5" />

            <line class="path-line2-4" x1="740" y1="335" x2="740" y2="365" stroke="rgb(148,163,184)" stroke-width="1.5" />

              <text x="540" y="615" text-anchor="middle" font-size="12" fill="rgb(100,116,139)">Store pending_suggestions</text>
              <text x="540" y="638" text-anchor="middle" font-size="12" fill="rgb(148,163,184)">pending_suggestions:</text>

            <!-- USER SEES RESPONSE -->
            <g>
              <rect class="response-box" x="530" y="795" rx="10" ry="10" width="220" height="45" fill="white" stroke="rgb(0,212,180)" stroke-width="1" />
              <text x="640" y="821" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(26,35,50)">USER SEES RESPONSE</text>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </main>

  <script>
    // State management
    let hoveredPath = null;

    // Color mapping
    const pathColors = {
      1: 'rgb(148,163,184)', // Grey
      2: 'rgb(0,212,180)',    // Teal
      3: 'rgb(255,107,107)',  // Coral
      4: 'rgb(46,91,218)',    // Blue
      5: 'rgb(16,185,129)',   // Green
      6: 'rgb(251,191,36)'    // Yellow
    };

    function getPathColor(pathIndex) {
      return pathColors[pathIndex] || 'rgb(148,163,184)';
    }

    function updatePathHighlight(pathIndex) {
      const isHighlighted = hoveredPath === pathIndex;
      const color = isHighlighted ? getPathColor(pathIndex) : 'rgb(148,163,184)';
      const width = isHighlighted ? '3' : '1.5';

      // Update all lines for this path
      ['.path-line-', '.path-line2-', '.path-line3-', '.path-line4-'].forEach(className => {
        const line = document.querySelector(`${className}${pathIndex}`);
        if (line) {
          line.setAttribute('stroke', color);
          line.setAttribute('stroke-width', width);
        }
      });

      // Update output rect
      const outputRect = document.querySelector(`.output-group[data-path="${pathIndex}"] .output-rect`);
      if (outputRect) {
        outputRect.setAttribute('stroke', color);
        outputRect.setAttribute('stroke-width', isHighlighted ? '2' : '1');
        outputRect.style.filter = isHighlighted ? `drop-shadow(0 4px 12px ${color}40)` : 'none';
      }

      // Update state rect
      const stateRect = document.querySelector(`.state-group[data-path="${pathIndex}"] .state-rect`);
      if (stateRect) {
        stateRect.setAttribute('stroke', color);
        stateRect.setAttribute('stroke-width', isHighlighted ? '2' : '1');
        stateRect.style.filter = isHighlighted ? `drop-shadow(0 4px 12px ${color}40)` : 'none';
      }
    }

    function updateCommonLines() {
      const color = hoveredPath ? getPathColor(hoveredPath) : 'rgb(148,163,184)';
      const width = hoveredPath ? '3' : '1.5';

      // Update horizontal and vertical lines that change with any hover
      const commonLines = [
        '.horizontal-line',
        '.vertical-to-pattern',
        '.vertical-from-pattern',
        '.horizontal-to-states',
        '.final-horizontal',
        '.final-vertical'
      ];

      commonLines.forEach(className => {
        const line = document.querySelector(className);
        if (line) {
          line.setAttribute('stroke', color);
          line.setAttribute('stroke-width', width);
        }
      });

      // Update pattern box
      const patternBox = document.querySelector('.pattern-box');
      if (patternBox) {
        patternBox.setAttribute('stroke', color);
        patternBox.style.filter = hoveredPath ? `drop-shadow(0 4px 12px ${color}40)` : 'none';
      }

      // Update response box
      const responseBox = document.querySelector('.response-box');
      if (responseBox) {
        responseBox.setAttribute('stroke', hoveredPath ? color : 'rgb(0,212,180)');
        responseBox.setAttribute('stroke-width', hoveredPath ? '2' : '1');
        responseBox.style.filter = hoveredPath ? `drop-shadow(0 4px 12px ${color}40)` : 'none';
      }
    }

    // Add event listeners to output groups
    document.querySelectorAll('.output-group').forEach(group => {
      const pathIndex = parseInt(group.getAttribute('data-path'));

      group.addEventListener('mouseenter', () => {
        hoveredPath = pathIndex;
        updatePathHighlight(pathIndex);
        updateCommonLines();
      });

      group.addEventListener('mouseleave', () => {
        const oldPath = hoveredPath;
        hoveredPath = null;
        updatePathHighlight(oldPath);
        updateCommonLines();
      });
    });

    // Add event listeners to state groups
    document.querySelectorAll('.state-group').forEach(group => {
      const pathIndex = parseInt(group.getAttribute('data-path'));

      group.addEventListener('mouseenter', () => {
        hoveredPath = pathIndex;
        updatePathHighlight(pathIndex);
        updateCommonLines();
      });

      group.addEventListener('mouseleave', () => {
        const oldPath = hoveredPath;
        hoveredPath = null;
        updatePathHighlight(oldPath);
        updateCommonLines();
      });
    });
  </script>
</body>
</html>
